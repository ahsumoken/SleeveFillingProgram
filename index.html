<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sleeve Tracker" />
  <title>Sleeve Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2330;
      --line: #2a3544;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --acc: #3d8bfd;
      --ok: #3dd68c;
      --warn: #f5c542;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { padding: 16px 16px 8px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
    nav {
      display: flex; gap: 8px; padding: 8px 16px 12px; position: sticky; top: 0;
      background: var(--bg); z-index: 5; border-bottom: 1px solid var(--line);
    }
    nav button {
      flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 10px; border-radius: 10px; font-weight: 600;
    }
    nav button.active { background: var(--acc); border-color: var(--acc); color: #fff; }
    main { padding: 12px 16px 96px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .muted { color: var(--muted); font-size: .85rem; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .badge { font-size: .75rem; padding: 3px 8px; border-radius: 999px; background: #243044; color: var(--muted); }
    .badge.done { background: #163528; color: var(--ok); }
    .badge.run { background: #1e2f4d; color: var(--acc); }
    button.primary, button.ghost {
      width: 100%; padding: 12px; border-radius: 10px; border: 0; font-weight: 700; margin-top: 8px;
    }
    button.primary { background: var(--acc); color: #fff; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    input, textarea, select {
      width: 100%; background: #121821; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px; margin-top: 4px;
    }
    ul { margin: 8px 0 0; padding-left: 18px; }
    li { margin: 4px 0; }
    .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .week-nav button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
    .ex { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .ex:last-child { border-bottom: 0; }
    .km { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Sleeve Tracker</h1>
    <p>21 sep 2026 · 13 weken · 240 km</p>
  </header>
  <nav>
    <button data-tab="week" class="active">Week</button>
    <button data-tab="sessie">Sessie</button>
    <button data-tab="log">Log</button>
  </nav>
  <main id="app"></main>
  <script src="./app.js"></script>
</body>
</html>
